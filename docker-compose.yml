services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      PORT: 8000
      DATABASE_PATH: /app/data/aimosi.sqlite3
      DEMO_MODE: ${DEMO_MODE:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes: ["aimosi-data:/app/data"]
    restart: unless-stopped
volumes:
  aimosi-data:
